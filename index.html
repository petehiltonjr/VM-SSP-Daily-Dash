<style>
:root {
  --bg: #0f1117;
  --surface: #181b24;
  --surface2: #1e2130;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --text2: #8b90a0;
  --text3: #555b6e;
  --accent: #4f7cff;
  --green: #3ecf8e;
  --amber: #f5a623;
  --red: #f04444;
  --openx: #4f7cff;
  --equativ: #3ecf8e;
  --mag-curate: #f5a623;
  --mag-stream: #c084fc;
  --xandr: #fb923c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.5; min-height: 100vh; }
.mono { font-family: 'DM Mono', monospace; }

/* Header */
.header { border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--text); text-transform: uppercase; }
.logo span { color: var(--accent); }
.header-right { font-size: 11px; color: var(--text3); }
.data-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; background: var(--bg); position: sticky; top: 52px; z-index: 99; }
.tab { font-size: 12px; padding: 10px 16px; cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* Layout */
.page { display: none; padding: 20px 24px; }
.page.active { display: block; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
.metrics-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
.mc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.mc-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.mc-val { font-size: 24px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
.mc-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }
.mc-val.danger { color: var(--red); }
.mc-val.success { color: var(--green); }

/* Chart area */
.chart-grid { display: grid; grid-template-columns: 1fr 200px; gap: 16px; margin-bottom: 20px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.chart-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 12px; }
.chart-wrap { position: relative; height: 160px; }
.legend { display: flex; flex-direction: column; gap: 8px; }
.leg { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.plat-bars { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.pb-row { }
.pb-top { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3px; color: var(--text2); }
.pb-bg { height: 3px; background: var(--surface2); border-radius: 2px; }
.pb-fill { height: 3px; border-radius: 2px; transition: width 0.4s ease; }

/* Flag bar */
.flag-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.fc { flex: 1; min-width: 90px; padding: 10px 14px; border-radius: 8px; border: 1px solid; }
.fc-stopped { background: rgba(240,68,68,0.08); border-color: rgba(240,68,68,0.2); color: #f87171; }
.fc-declining { background: rgba(245,166,35,0.08); border-color: rgba(245,166,35,0.2); color: #fbbf24; }
.fc-growing { background: rgba(62,207,142,0.08); border-color: rgba(62,207,142,0.2); color: var(--green); }
.fc-stable { background: var(--surface); border-color: var(--border); color: var(--text2); }
.fc-num { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; }
.fc-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; opacity: 0.8; }

/* Filters */
.filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.fb { font-size: 11px; padding: 4px 12px; border: 1px solid var(--border2); border-radius: 20px; background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.fb:hover { border-color: var(--accent); color: var(--text); }
.fb.active { background: rgba(79,124,255,0.15); color: var(--accent); border-color: var(--accent); }
.search-wrap { flex: 1; min-width: 160px; }
.search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 11px; padding: 5px 10px; height: 28px; outline: none; }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }

/* Table */
.tbl-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-height: 420px; overflow-y: auto; }
.tbl-wrap::-webkit-scrollbar { width: 4px; }
.tbl-wrap::-webkit-scrollbar-track { background: var(--surface); }
.tbl-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
thead th { font-size: 9px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); background: var(--surface2); position: sticky; top: 0; white-space: nowrap; z-index: 1; }
tbody td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; background: var(--surface); }
tbody tr:hover td { background: var(--surface2); cursor: pointer; }
tbody tr:last-child td { border-bottom: none; }
.dn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; font-family: 'DM Mono', monospace; font-size: 10px; }
.badge { display: inline-flex; align-items: center; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 500; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
.b-stopped { background: rgba(240,68,68,0.12); color: #f87171; }
.b-declining { background: rgba(245,166,35,0.12); color: #fbbf24; }
.b-growing { background: rgba(62,207,142,0.12); color: var(--green); }
.b-stable { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
.tu { color: var(--green); font-size: 10px; font-family: 'DM Mono', monospace; }
.td { color: var(--red); font-size: 10px; font-family: 'DM Mono', monospace; }
.tn { color: var(--text3); font-size: 10px; }
.pt { display: inline-block; font-size: 8px; padding: 1px 5px; border-radius: 3px; margin-right: 2px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

/* Detail row */
.dr td { background: var(--surface2) !important; padding: 12px 14px; font-size: 11px; }
.di { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dl { font-weight: 500; color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.dv { color: var(--text); line-height: 1.5; }
.dv-empty { color: var(--text3); font-style: italic; }
.dv-week { font-size: 10px; color: var(--text3); margin-top: 4px; }
.dmeta { display: flex; gap: 20px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.dmeta-item .dl { margin-bottom: 2px; }

/* Seller pill */
.seller-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.seller-name { font-size: 18px; font-weight: 600; color: var(--text); }
.seller-meta { font-size: 11px; color: var(--text3); }
.seller-meta span { color: var(--text2); }

/* No results */
.no-r { padding: 32px; text-align: center; color: var(--text3); background: var(--surface); }

/* Section label */
.sec { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

/* Responsive */
@media (max-width: 700px) {
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}

.rs-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.rs-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rs-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rs-dot.ok{background:#3ecf8e}
.rs-dot.late{background:#f59e0b}
.rs-name{font-size:11px;font-weight:600;flex:1}
.rs-status{font-size:10px;font-weight:700;letter-spacing:.5px}
.rs-date{font-size:10px;color:var(--text3)}

/* Global filters: date range + platform */
.filters { position: sticky; top: 93px; z-index: 98; background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.flab { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; width: 62px; flex-shrink: 0; }
.fsum { margin-left: auto; font-size: 11px; color: var(--text2); }
.pchip { display: inline-flex; align-items: center; gap: 6px; }
.pd { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.dinput { background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 8px; height: 26px; outline: none; color-scheme: dark; }
.dinput:focus { border-color: var(--accent); }
.leg.off { opacity: 0.35; }
.note { font-size: 10px; color: var(--text3); margin: 0 0 8px; }
@media (max-width: 700px) { .filters { position: static; padding: 8px 12px; } .fsum { margin-left: 0; width: 100%; } .flab { width: auto; } }
</style>

const fmt = v => '$' + Math.round(v).toLocaleString();
const fmtS = v => v >= 1000 ? '$' + (v/1000).toFixed(0) + 'k' : '$' + Math.round(v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toMs = iso => { const p = iso.split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); };
const isoOf = ms => new Date(ms).toISOString().slice(0,10);
const addDays = (iso, n) => isoOf(toMs(iso) + n*86400000);
const daysBetween = (a, b) => Math.round((toMs(b) - toMs(a)) / 86400000);
const monthStart = iso => iso.slice(0,8) + '01';
const quarterStart = iso => { const m = +iso.slice(5,7); return iso.slice(0,5) + String(m - ((m-1) % 3)).padStart(2,'0') + '-01'; };
const fmtD = iso => MONTHS[+iso.slice(5,7)-1] + ' ' + (+iso.slice(8,10));
const fmtDY = iso => fmtD(iso) + ', ' + iso.slice(0,4);
const pcol = p => PLAT_COLORS[p] || '#8b90a0';
const pname = p => p || '(blank)';
const shortD = d => { const p = d.split('-'); return p[1].replace(/^0/,'') + '/' + p[2].replace(/^0/,''); };

const RD = DASH_REC.dates, RP = DASH_REC.plats, RS = DASH_REC.sellers, RL = DASH_REC.deals, RR = DASH_REC.rows;

const MIND = RD.length ? RD[0] : MAXD;
const HAS_DATA = RR.length > 0 && !!MAXD;

const state = { preset: 'mtd', from: '', to: '', plats: new Set(RP) };

// ---------------------------------------------------------------- aggregation
let C = null, version = 0;
function compute() {
  const from = state.from, to = state.to, nP = RP.length, nD = RD.length, nS = RS.length, K = RL.length || 1;
  const L7 = addDays(MAXD, -7), L14 = addDays(MAXD, -14);
  const platOn = RP.map(p => state.plats.has(p));
  const ent = new Map();
  const dayG = new Float64Array(nD * nP), dayN = new Float64Array(nD * nP);
  const selG = new Float64Array(nS * nD), selN = new Float64Array(nS * nD);
  const platTot = new Float64Array(nP);
  let totG = 0, totN = 0;
  for (let i = 0; i < RR.length; i++) {
    const r = RR[i], p = r[1];
    if (!platOn[p]) continue;
    const di = r[0], date = RD[di], g = r[4], n = r[5];
    const key = r[3] * K + r[2];
    let e = ent.get(key);
    if (!e) { e = {deal: r[2], seller: r[3], plats: new Set(), spend: 0, net: 0, last7: 0, prior7: 0, last: '', inRange: false}; ent.set(key, e); }
    e.plats.add(p);
    if (date > L7) e.last7 += g; else if (date > L14) e.prior7 += g;
    if (g > 0 && date > e.last) e.last = date;
    if (date >= from && date <= to) {
      e.spend += g; e.net += n; if (g > 0) e.inRange = true;
      dayG[di*nP + p] += g; dayN[di*nP + p] += n;
      selG[r[3]*nD + di] += g; selN[r[3]*nD + di] += n;
      platTot[p] += g; totG += g; totN += n;
    }
  }
  return {from, to, ent: [...ent.values()], dayG, dayN, selG, selN, platTot, totG, totN};
}
function statusOf(e) {

  let flag = 'stable';

  else if (trend !== null && trend < -20) flag = 'declining';
  else if (trend !== null && trend > 20) flag = 'growing';

}
function toRow(e) {

          trend: s.trend, flag: s.flag, opt: d.o || '', notes: d.t || '', week: d.w || '', days: e.last ? daysBetween(e.last, MAXD) : null};
}
function dealRowsFor(sellerIdx) {            // sellerIdx = null -> all sellers, merged per deal
  const m = new Map();
  for (const e of C.ent) {
    if (sellerIdx !== null && e.seller !== sellerIdx) continue;
    const k = sellerIdx !== null ? e.seller * 1000003 + e.deal : e.deal;
    let a = m.get(k);
    if (!a) { a = {deal: e.deal, seller: e.seller, plats: new Set(), spend: 0, net: 0, last7: 0, prior7: 0, last: '', inRange: false}; m.set(k, a); }
    e.plats.forEach(p => a.plats.add(p));

    if (e.last > a.last) a.last = e.last;
    if (e.inRange) a.inRange = true;
  }
  return [...m.values()].filter(a => a.inRange).map(toRow).sort((a,b) => b.spend - a.spend);
}

    let f = dF.value, t = dT.value;
    if (f > t) { if (ev && ev.target === dF) t = f; else f = t; }   // moving one end past the other drags the other end along
    state.preset = 'custom'; setRange(f, t); refresh();
  };
  dF.addEventListener('change', onDate); dT.addEventListener('change', onDate);
  const place = () => { const h = document.querySelector('.header').offsetHeight + tabBar.offsetHeight; bar.style.top = h + 'px'; };
  place(); window.addEventListener('resize', place);
}
function syncFilterUI() {
  document.querySelectorAll('#presetBtns .fb').forEach(b => b.classList.toggle('active', b.getAttribute('data-preset') === state.preset));
  document.querySelectorAll('#platBtns .fb').forEach(b => {
    const p = b.getAttribute('data-plat');
    b.classList.toggle('active', p === '*' ? allPlats() : (!allPlats() && state.plats.has(p)));
  });
  document.getElementById('customDates').style.display = state.preset === 'custom' ? 'inline-flex' : 'none';
  document.getElementById('dFrom').value = state.from; document.getElementById('dTo').value = state.to;
  const n = daysBetween(state.from, state.to) + 1;
  document.getElementById('fSum').textContent = fmtDY(state.from) + ' – ' + fmtDY(state.to) + ' · ' + n + (n === 1 ? ' day' : ' days') + ' · ' + platText();
}
function refresh() { C = compute(); version++; syncFilterUI(); renderTab(activeTab); }

// ---------------------------------------------------------------- init
function init() {
  const asof = document.getElementById('asof');
  if (!HAS_DATA) {
    asof.textContent = 'No data loaded';
    document.getElementById('filterBar').style.display = 'none';
    tabContents.innerHTML = '<div class="page active"><div class="no-r">No data has been loaded into the dashboard yet. It fills in after the next ingest run.</div></div>';
    return;
  }
  asof.textContent = 'Through ' + MAXD + (DASH_META.generated_at ? ' · Updated ' + DASH_META.generated_at : '');
  ['Overview'].concat(SELLER_NAMES).forEach(name => {
    const btn = document.createElement('button'); btn.className = 'tab' + (name === 'Overview' ? ' active' : ''); btn.textContent = name;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(t => t.classList.remove('active'));
      btn.classList.add('active'); document.getElementById('page-' + name).classList.add('active');
      activeTab = name; renderTab(name);
    });
    tabBar.appendChild(btn);
  });
  buildOverviewShell();
  SELLER_NAMES.forEach(name => { const d = document.createElement('div'); d.id = 'page-' + name; d.className = 'page'; tabContents.appendChild(d); });
  buildFilterBar();
  setPreset('mtd');
  refresh();
}
init();

</script>
</body>
